; Ultimate ASI Loader v9.7.4 settings, installed next to dinput8.dll by grimCompare scripts/deploy.sh.
;
; dontloadfromdllmain=0: load the real system dinput8.dll and the *.asi plugins inside the
; loader's own DllMain. With the default (1) the loader defers both until a hooked kernel32 call
; (UAL source/dllmain.cpp: Init(), LoadPluginsAndRestoreIAT(), LoadOriginalLibrary()).
; Grim Dawn loads dinput8.dll late (DirectInput.dll import) and calls DirectInput8Create right
; away, so with the default the proxy export jumps through a still-NULL pointer:
; crash 2026-11-14, EXCEPTION_ACCESS_VIOLATION executing 0x0, return address DirectInput.dll+0x2E73.
[globalsets]
dontloadfromdllmain=0

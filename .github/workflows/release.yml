# On a version tag: build the release zip (scripts/package.sh) and attach it to the GitHub Release.
# The same zip is uploaded to Nexus by hand.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/xwin
          key: xwin-10.0.22621-desktop-x86_64
      - name: MSVC CRT and Windows SDK (xwin, docs/BUILD.md)
        run: |
          [ -d ~/.local/share/xwin/crt ] || nix-shell --run 'xwin --accept-license --arch x86_64 --variant desktop \
            --sdk-version 10.0.22621 --cache-dir ~/.cache/xwin splat --output ~/.local/share/xwin'
      - name: Tests
        run: nix-shell --run 'cmake --workflow --preset core'
      - name: Package
        run: bash scripts/package.sh
      - name: Check the tag matches the setup version
        run: test -f "dist/GDCompare-${GITHUB_REF_NAME#v}.zip"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/GDCompare-${GITHUB_REF_NAME#v}.zip"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" "$zip" "$zip.sha256" --clobber

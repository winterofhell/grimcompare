# GD Compare build catalog: the builds the setup wizard offers. Source: docs/build-ref/build-matrix.md
# (intent only), every skill, set, conversion and class checked against the 1.3.1.1 database
# (database.arz + GDX1..3, Text_EN). What the matrix got wrong: docs/build-ref/ERRATA.md §9.
#
# Per build:
#   id, name, category (melee | ranged | caster | pets | hybrid)
#   classes   class tags tagSkillClassNameXXYY as "XXYY" (XX, YY = mastery numbers, playerclassXX)
#   damage    final damage types ([match] damage names, docs/PRESETS.md)
#   skills    main skill records: attacks only (score.cpp attack_class, or the default weapon attack). Summons, totems,
#             traps and auras are scored as a share on top of these, so a summoner lists the default weapon attack.
#             The wizard keeps the default attack and the skills of the character's masteries.
#   sets      lootset records for target_sets
#   other     [other] weight overrides, only where Damage / Survivability do not see the stat
#   conversion, stats, items: plain-words hints for the menu
# [[build.variant]] overrides any of name, classes, damage, skills, sets, other, conversion, stats, items.
# Skills are scored from the character's real points; conversions from the real gear. Nothing here is a weight
# on damage types: a converted-away type scores ~0 from the math.


# plague-garden: Acid / Poison Occultist + Shaman (Conjurer), docs/build-ref/plague-garden.md.
# Records: docs/build-ref/ERRATA.md §8. Missing keys keep presets/default.toml's values.
#
# Acid / Poison is not set anywhere: Damage is the main skills' own damage after conversions, so a bonus to a
# type the skills do not end up dealing scores ~0 by itself.
#
# Every number here is a DESIGN CHOICE (docs/PRESETS.md). Stage boundaries and skills follow the guide's
# levelling plan (§4 "1 -> 100"); the level ranges are the guide's, not game rules.

[preset]
name = "plague-garden"
# Hovering a piece of these sets notes how many are worn and which are missing (also below its level).
target_sets = ["records/items/lootsets/itemset_d313.dbr"]  # Worldkeeper's Garden (helm, shoulders, chest, medal)

# winterpoison is bound to this preset: Auto picks it for that character at every level, with no mastery,
# archetype or damage check (levelling skills deal Vitality / Physical until the conversion gear arrives, so
# the min_share check below fails at stages 1-35).
# Any other character: Auto picks it when its masteries are Shaman and / or Occultist only, its class skill
# points go mostly to attack spells (archetype caster) AND its main skills (the 3 class attack skills with
# the most points, after conversions) deal at least min_share Acid + Poison. Otherwise the generic preset
# (GDCompare.preset.toml) scores. The log says why either way.
# Note: Devouring Swarm (Vitality + Bleeding), Grasping Vines (Physical + Bleeding) and Bloody Pox (Vitality +
# Bleeding) need conversion gear to count; Dreeg's Evil Eye is Acid + Poison by itself.
[match]
characters = ["winterpoison"]
masteries = [
  "records/skills/playerclass06/_classtraining_class06.dbr",  # Shaman
  "records/skills/playerclass03/_classtraining_class03.dbr",  # Occultist
]
archetype = "caster"  # the guide's build: spells, no pets or retaliation focus (score::archetype)
damage = ["acid", "poison"]
min_share = 0.5   # design choice

[damage]
# Main skills weigh by the points spent in them: a skill with 1 point is not scored like a maxed one.
skill_weights = "points"
# Red line when an item adds one of these conversions and its output is not Acid/Poison ([match] damage).
# The guide forbids Acid -> Vitality / Cold / Fire, Physical -> Chaos / Fire, Vitality -> Chaos
# (docs/build-ref/priorities.md §1); this list is wider (any output but Acid/Poison, design choice).
# Vitality / Physical -> Acid (Bat, Groble Vile Effigy, Worldkeeper's Gaze, priorities §1) never warn.
# A conversion names the direct type and moves its DoT too ("acid" = DB "Poison"; Acid -> X also moves Poison,
# Vitality -> X Vitality Decay, Physical -> X Internal Trauma; docs/MECHANICS.md §2).
conversion_warn = ["acid->*", "vitality->*", "physical->*"]

# Utility stats (presets/default.toml lists what each value is). Weights follow docs/build-ref/priorities.md where
# it says something (§ cited); the rest keep the default's design choices.
[other]
run_speed = 0.5                               # default
life_regen = 0.05                             # §3.6 "% Health Regeneration scales hard" (set medal, Oak Skin, Behemoth): above default 0.02
energy_regen = 0.02                           # default
life_leech = 1.0                              # §2 ADCtH 12%+ (Yugol, Bat, Bramblevine): weighted high. Gear ADCtH
                                              # reaches only weapon-damage skills (none here): the value is the
                                              # main skills' own + modifiers' (Bramblevine), MECHANICS §6
stun_resist = 0.1                             # default; the target is in [thresholds] (§2 75-80%)
freeze_resist = 0.05                          # default; target in [thresholds] (§2 50%+)
petrify_resist = 0.05                         # default
sleep_resist = 0.05                           # default
trap_resist = 0.05                            # default
knockdown_resist = 0.05                       # default
slow_resist = 0.05                            # default; target in [thresholds] (§2 50%+)
disruption_resist = 0.05                      # default
experience = 0.2                              # default (0 at level 100)
retaliation = 0                               # §1 "don't collect items for pure Retaliation: it breaks the DoT scaling"
retaliation_modifier = 0                      # §1 "% Retaliation Damage Added to Attack is a free bonus": not sought
pet_bonus = { weight = 0.2, when = "pets" }   # default. Living Bloom / Blossom are PetPlayerScaling: no pet
                                              # bonus, the player's own bonuses scale them (score as procs)
default = 0.05                                # default

[score]
# "Resist caps first" (docs/build-ref/priorities.md §3) without a fixed overcap buffer: a point under the 80
# target costs 4x the default on top of the damage it lets through, about 0.7% Survivability per point of a
# resist with a 10% threat share. Chosen so that 7 Fire + 15 Pierce under the cap outweigh +28 Physique and
# +8% Life (the belt case, tests/test_presets.cpp) while a +2 skills medal that costs 10 Poison still wins.
threshold_resist_weight = 4

[survival]
# Incoming resistance reduction (enemy curses / debuffs) the base resists are scored under. "auto" = what the
# monsters of the character's level and difficulty apply (docs/MECHANICS.md §9): about 2-3% of them lower a
# given resist by 10-17 points (bosses, weighted by boss_share: 8% by 12-25), so overcap is worth little while
# levelling and a resist below 80 stays costly. difficulty_lookahead (default on) adds the next difficulty's
# extra -25 from level 65 on Normal and 84 on Elite, so overcap up to it counts before the switch (the guide
# moves to Elite at 75, to Ultimate at 94). The 94+ stage sets the guide's endgame buffer. Physical and
# crowd-control resists are not lowered.
resist_reduction = "auto"

# Defense targets (docs/PRESETS.md "Thresholds"): Survivability x a smooth curve per stat, steep below the
# target, small above. Resists 80 at every stage (gameengine.dbr playerDefenseCap, PRESETS decision); a stage
# adds its own below. Lower-stage values are design choices; 94+ is priorities.md §2 (endgame minimums).
[thresholds]
resist = 80

# Stages: the LAST block (in file order) whose level range and `requires` hold is used; none -> the
# settings above (default skills: auto). A stage restates only what it changes.

# Levels 1-10: Shaman, Devouring Swarm 16/16 + 1 point in Grasping Vines.
[[stage]]
name = "1-10"
requires = ["records/skills/playerclass06/_classtraining_class06.dbr"]
[stage.damage]
skills = [
  "records/skills/playerclass06/devouringswarm1.dbr",  # Devouring Swarm
  "records/skills/playerclass06/graspingvines1.dbr",   # Grasping Vines
]

# Levels 10-35: Occultist added (Curse of Frailty, Blood of Dreeg, Bloody Pox slowly). Devouring Swarm still
# carries the damage.
[[stage]]
name = "10-35"
min_level = 10
requires = [
  "records/skills/playerclass06/_classtraining_class06.dbr",
  "records/skills/playerclass03/_classtraining_class03.dbr",
]
[stage.damage]
skills = [
  "records/skills/playerclass06/devouringswarm1.dbr",  # Devouring Swarm
  "records/skills/playerclass06/graspingvines1.dbr",   # Grasping Vines
  "records/skills/playerclass03/pox1.dbr",             # Bloody Pox
  "records/skills/playerclass03/evileye1.dbr",         # Dreeg's Evil Eye
]

# Levels 35-93: the core rotation (guide §6): Grasping Vines spam, Bloody Pox, Dreeg's Evil Eye.
[[stage]]
name = "35-93"
min_level = 35
requires = [
  "records/skills/playerclass06/_classtraining_class06.dbr",
  "records/skills/playerclass03/_classtraining_class03.dbr",
]
[stage.thresholds]  # design choices: on the way to the 94+ values
physical_resist = 10
absorption = 90
stun_resist = 50
[stage.damage]
skills = [
  "records/skills/playerclass06/graspingvines1.dbr",  # Grasping Vines
  "records/skills/playerclass03/pox1.dbr",            # Bloody Pox
  "records/skills/playerclass03/evileye1.dbr",        # Dreeg's Evil Eye
]

# Level 94+: Worldkeeper's Garden and the endgame devotions. Same main skills; procs (devotions, item / set
# procs) and the set's Living Bud / Blossom pets add their damage and RR (docs/MECHANICS.md §4, §5).
[[stage]]
name = "94+"
min_level = 94
requires = [
  "records/skills/playerclass06/_classtraining_class06.dbr",
  "records/skills/playerclass03/_classtraining_class03.dbr",
]
[stage.score]
threshold_resist_weight = 1  # the 25 buffer below already makes every point up to 105 count
[stage.survival]
# docs/build-ref/priorities.md §2 "+25-35% overcap on all 9 base resists" (endgame bosses, not in the monster
# table): its lower bound, always on. A base resist needs 105 uncapped to stop costing Survivability.
resist_reduction = 25
[stage.thresholds]  # docs/build-ref/priorities.md §2, "target minimum" column
# overcap: [stage.survival] resist_reduction 25 with resist 80 (no resist_overcap, which would count the same
# 25 points twice)
physical_resist = 20
absorption = 100           # "98-100%, get it to 100%"
armor = 2200
stun_resist = 75           # "75-80%"
freeze_resist = 50         # "Freeze / Slow 50%+"
slow_resist = 50           # unverified: read from defense type 16 (TotalSpeed)
reflect_reduction = 55
life = 16000
da = 2750
[stage.damage]
skills = [
  "records/skills/playerclass06/graspingvines1.dbr",  # Grasping Vines
  "records/skills/playerclass03/pox1.dbr",            # Bloody Pox
  "records/skills/playerclass03/evileye1.dbr",        # Dreeg's Evil Eye
]
